[mypy]
python_version = 3.9
disallow_untyped_defs = True
warn_return_any = True
warn_unused_configs = True
exclude = src/gen

[mypy-antlr4.*]
ignore_missing_imports = True

[mypy-GremlinCLexer.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-GremlinCParser.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-GremlinCVisitor.*]
follow_imports = skip
ignore_missing_imports = True